/*
 * HelpServ — the operator help desk (like NickServ / ChanServ).
 *
 * AideMoi and SignalMoi are HelpServ's client bots, not separate modules.
 * Users talk to AideMoi / SignalMoi; helpers handle tickets on HelpServ.
 * HelpServ announces new tickets on #_BO and #_logs.
 *
 * Copy this file to conf/helpserv.conf (same pattern as botserv.conf), then
 * add to anope.conf:
 *   include { type = "file"; name = "helpserv.conf" }
 *
 * Helpers present on #_BO can use staff commands without an opertype.
 * To also grant access via opertype, add to the relevant opertype block:
 *   commands = "helpserv/helper"
 *   (helpserv/manager and helpserv/admin also work; helpserv/* matches all of them)
 *
 * Add a bot to another channel (HelpServ only — BotServ ASSIGN is refused):
 *   /msg HelpServ JOIN AideMoi #salon
 *   /msg HelpServ JOIN SignalMoi #salon
 *   /msg HelpServ PART AideMoi #salon
 *
 * For French replies, set options:defaultlanguage to "fr_FR.UTF-8" and/or
 * NS SET LANGUAGE fr_FR.UTF-8 on helper and user accounts.
 */

service
{
	nick = "HelpServ"
	user = "helpserv"
	host = "${services.host}"
	real = "Help desk"
	#modes = "+o"
	channels = "@#_BO,@#_logs"
	# HostServ already uses /HS when servicealias is on.
	alias = "HLP"
}

service
{
	nick = "AideMoi"
	user = "aide"
	host = "${services.host}"
	real = "Service d'aide"
	#modes = "+o"
	channels = "@#Aide.chat"
	alias = "AIDE"
}

service
{
	nick = "SignalMoi"
	user = "signal"
	host = "${services.host}"
	real = "Service de signalement"
	#modes = "+o"
	channels = "@#Signalement.chat"
	alias = "SIGNAL"
}

module
{
	name = "helpserv"
	client = "HelpServ"
	user = "helpserv"
	real = "Help desk"

	staff_channel = "#_BO"
	log_channel = "#_logs"
	# After greetings and empty asks ("j'ai besoin d'aide") are stripped,
	# at least this many characters must remain before a ticket is opened.
	min_request_len = 12

	# Anti-spam (unregistered users may still open help and report tickets).
	msg_interval = 2
	unreg_min_online = 20
	unreg_per_hour = 2
	unreg_per_day = 5
	reg_per_hour = 6
	reg_per_day = 15
	unreg_cooldown = 180
	ip_per_hour = 8

	help
	{
		nick = "AideMoi"
		user = "aide"
		host = "${services.host}"
		real = "Service d'aide"
		channel = "#Aide.chat"
		#greeting = "Bienvenue sur #Aide.chat. Envoyez un message privé à AideMoi pour demander de l'aide."

		# Extra automatic replies (optional). Built-in EntreNous links are
		# already sent for webchat, NickServ, Gaya, and server docs.
		# match is a comma-separated list of phrases; reply may use \n.
		# auto
		# {
		# 	match = "bouncer, bnc"
		# 	reply = "Le bouncer EntreNous : https://www.reseau-entrenous.fr/aide/"
		# }
	}

	report
	{
		nick = "SignalMoi"
		user = "signal"
		host = "${services.host}"
		real = "Service de signalement"
		channel = "#Signalement.chat"
		# Unregistered users may file reports. Set to yes to require identify.
		require_account = no
	}
}

command_group
{
	name = "helpserv/staff"
	description = _("Helper commands")
}

command { service = "HelpServ"; name = "HELP"; command = "generic/help" }
command { service = "HelpServ"; name = "AIDE"; command = "generic/help"; hide = yes }
