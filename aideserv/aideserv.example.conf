command { service = "AideMoi"; name = "VOIR"; command = "aideserv/show"; group = "aideserv/staff"; hide = yes }
command { service = "AideMoi"; name = "FERMER"; command = "aideserv/close"; group = "aideserv/staff"; hide = yes }
command { service = "AideMoi"; name = "NOTE"; command = "aideserv/addnote"; group = "aideserv/staff"; hide = yes }
