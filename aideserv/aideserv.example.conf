/*
 * Example configuration for AideServ (AideMoi / SignalMoi).
 *
 * Inspired by X3 HelpServ: two bots share one ticket database.
 *   AideMoi     — help desk on #Aide.chat
 *   SignalMoi   — reports on #Signalement.chat
 *   #_BO        — locked staff channel (notifications)
 *   #_logs      — locked log / IRCOP channel (audit copy)
 *
 * Load this file from anope.conf:
 *   include { type = "file"; name = "aideserv.example.conf" }
 *
 * Helpers present on #_BO can use staff commands without an opertype.
 * To also grant access via opertype, add to the relevant opertype block:
 *   commands = "aideserv/helper"
 *   (aideserv/manager and aideserv/admin also work; aideserv/* matches all of them)
 *
 * For French replies, set options:defaultlanguage to "fr_FR.UTF-8" and/or
 * NS SET LANGUAGE fr_FR.UTF-8 on helper and user accounts.
 */

/*
 * Create the two service clients. Prefix @ on locked channels so the bots
 * join with channel operator status, the same way other Anope services do.
 */
service
{
	nick = "AideMoi"
	user = "aide"
	host = "${services.host}"
	real = "Service d'aide"
	#modes = "+o"
	channels = "@#Aide.chat,@#_BO,@#_logs"
	alias = "AIDE"
}

service
{
	nick = "SignalMoi"
	user = "signal"
	host = "${services.host}"
	real = "Service de signalement"
	#modes = "+o"
	channels = "@#Signalement.chat,@#_BO,@#_logs"
	alias = "SIGNAL"
}

module
{
	name = "aideserv"

	/*
	 * Locked staff channel that receives help and report notifications.
	 * Anyone present on this channel is treated as a helper.
	 */
	staff_channel = "#_BO"

	/*
	 * Locked log / IRCOP channel. Receives a copy of staff notifications.
	 */
	log_channel = "#_logs"

	/*
	 * Minimum length before a free-form message is treated as a real request
	 * (greetings and very short lines are answered with a follow-up question
	 * instead of opening a ticket immediately).
	 */
	min_request_len = 12

	help
	{
		nick = "AideMoi"
		user = "aide"
		host = "${services.host}"
		real = "Service d'aide"
		channel = "#Aide.chat"
		/*
		 * Optional extra line sent as a private message when a user joins
		 * the help channel. If unset, a default translated greeting is used.
		 */
		#greeting = "Bienvenue sur #Aide.chat. Envoyez un message privé à AideMoi pour demander de l'aide."
	}

	report
	{
		nick = "SignalMoi"
		user = "signal"
		host = "${services.host}"
		real = "Service de signalement"
		channel = "#Signalement.chat"

		/*
		 * If yes, REPORT requires an identified account.
		 */
		require_account = yes
	}
}

command_group
{
	name = "aideserv/staff"
	description = _("Helper commands")
}

/* Commands are also bound by the module when it loads. These blocks keep
 * HELP populated across a rehash (Anope clears bot commands first). */
command { service = "AideMoi"; name = "HELP"; command = "generic/help" }
command { service = "AideMoi"; name = "AIDE"; command = "generic/help"; hide = yes }
command { service = "AideMoi"; name = "WAIT"; command = "aideserv/wait" }
command { service = "AideMoi"; name = "STATUS"; command = "aideserv/wait" }
command { service = "AideMoi"; name = "CANCEL"; command = "aideserv/cancel" }
command { service = "AideMoi"; name = "ATTENDRE"; command = "aideserv/wait"; hide = yes }
command { service = "AideMoi"; name = "STATUT"; command = "aideserv/wait"; hide = yes }
command { service = "AideMoi"; name = "ANNULER"; command = "aideserv/cancel"; hide = yes }
command { service = "AideMoi"; name = "LIST"; command = "aideserv/list"; group = "aideserv/staff" }
command { service = "AideMoi"; name = "NEXT"; command = "aideserv/next"; group = "aideserv/staff" }
command { service = "AideMoi"; name = "PICKUP"; command = "aideserv/pickup"; group = "aideserv/staff" }
