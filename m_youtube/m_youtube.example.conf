/*
 * m_youtube — BotServ announces title/duration/views when a YouTube URL
 * is posted in a channel that has a BotServ bot assigned.
 *
 * Load from anope.conf:
 *   include { type = "file"; name = "m_youtube.example.conf" }
 *
 * Requires libcurl at compile time. JSON parsing uses Anope's vendored yyjson.
 */

module
{
	name = "m_youtube"

	/*
	 * YouTube Data API v3 key. Lookups are disabled if unset.
	 */
	youtube_api_key = ""

	/*
	 * Optional response text. IRC formatting can use \x02 (bold), \x03 (color),
	 * \x0F (reset). Tokens in response_format: {title} {duration} {views}
	 */
	#prefix = "YouTube"
	#duration_text = "Duration: "
	#seen_text = "Seen: "
	#times_text = " times."
	#response_format = "{title} — {duration} — {views} views"

	/*
	 * Kick a user who posts more than spam_limit YouTube links in spam_window
	 * seconds in the same channel.
	 */
	spam_limit = 3
	spam_window = 60
	spam_kick = yes
	spam_kick_reason = "YouTube link spam"

	/* Cache API results this many seconds (also persisted in the JSON DB). */
	cache_ttl = 300
}

command { service = "BotServ"; name = "YOUTUBE"; command = "botserv/youtube" }
command { service = "BotServ"; name = "YTSTATS"; command = "botserv/ytstats" }
